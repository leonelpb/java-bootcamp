<div class="bg-white">
  <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8">
    <h2 class="sr-only">Products</h2>

    <div class="grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 xl:gap-x-8">
      <a *ngFor="let product of products" href="#" class="group">
        <div class="flex">
          <!-- Div que ocupa la mitad de la cuadricula -->
          <div class="w-1/2  h-1/2 aspect-w-1 aspect-h-1 overflow-hidden rounded-lg bg-gray-200">
            <img [src]="product.image" [alt]="product.title" class="h-1/2 w-full object-cover object-center group-hover:opacity-75">
          </div>

          <!-- Contenedor para el texto, que ocupará la otra mitad -->
          <div class="w-1/2 pl-4 flex flex-col justify-around">
            <h3 class="text-sm text-gray-700">{{ product.title }}</h3>
            <p class="mt-1 text-lg font-medium text-gray-900">${{ product.price }}</p>

            <button
            (click)="addToCart(product.id,1)"
            [ngClass]="isAuthenticated ? 'bg-yellow-500 text-white' : 'bg-gray-400 text-gray-800 cursor-not-allowed'"
            [disabled]="!isAuthenticated"
            class="mt-4 px-4 py-2 font-semibold rounded-md"
          >
          <i class="fa-solid fa-cart-shopping"></i>
          </button>
          </div>

        </div>
      </a>
    </div>
  </div>
</div>
